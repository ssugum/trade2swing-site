  <text x="80" y="530" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#a59fc4">What the April 8 FTD cohort taught about buying</text>
  <text x="80" y="560" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#a59fc4">leaders at the highs &#8212; and the cost of hesitating.</text>

  <!-- Stats -->
  <g transform="translate(80,640)">
    <text font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="44" fill="#ffffff">15</text>
    <text y="34" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#a59fc4" letter-spacing="1.4">LEADERS</text>

    <text x="180" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="44" fill="#10b981">~200%</text>
    <text x="180" y="34" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#a59fc4" letter-spacing="1.4">AVG GAIN</text>

    <text x="410" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="44" fill="#10b981">+467%</text>
    <text x="410" y="34" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#a59fc4" letter-spacing="1.4">BEST NAME</text>
