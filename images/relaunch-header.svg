    <text x="60" y="32" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="26" fill="#ffffff" letter-spacing="-0.5">Trade2Swing</text>
  </g>

  <!-- pill -->
  <g transform="translate(80,200)">
    <rect width="380" height="42" rx="21" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-opacity="0.6" stroke-width="1"/>
    <circle cx="22" cy="21" r="5" fill="#10b981"/>
    <text x="38" y="28" font-family="DejaVu Sans, Arial, sans-serif" font-weight="600" font-size="14" fill="#c4b5fd" letter-spacing="1.4">FTD 04/08/2026 &#183; MODEL BOOK ENTRY</text>
