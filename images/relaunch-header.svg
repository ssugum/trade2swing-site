      <rect x="310" y="230" width="8" height="50"/>
      <rect x="330" y="200" width="8" height="45"/>
      <rect x="350" y="170" width="8" height="42"/>
      <rect x="370" y="140" width="8" height="40"/>
      <rect x="390" y="115" width="8" height="38"/>
      <rect x="410" y="92" width="8" height="36"/>
      <rect x="430" y="75" width="8" height="32"/>
      <rect x="450" y="60" width="8" height="30"/>
      <rect x="470" y="48" width="8" height="28"/>
      <rect x="490" y="40" width="8" height="26"/>
      <rect x="510" y="35" width="8" height="22"/>
