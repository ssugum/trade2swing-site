      <rect x="60" y="290" width="8" height="40"/>
      <rect x="80" y="295" width="8" height="38"/>
      <rect x="100" y="285" width="8" height="48"/>
      <rect x="120" y="300" width="8" height="35"/>
      <rect x="140" y="310" width="8" height="30"/>
