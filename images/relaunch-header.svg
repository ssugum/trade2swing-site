  <rect width="1456" height="816" fill="url(#glow1)"/>
  <rect width="1456" height="816" fill="url(#glow2)"/>

  <!-- Trade2Swing wordmark -->
  <g transform="translate(80,80)">
    <rect width="44" height="44" rx="10" fill="#6366f1"/>
