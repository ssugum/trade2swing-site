<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr. Market — The Instrument Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   Mr. Market — The Instrument Panel  (weekly dashboard)
   -------------------------------------------------------------------------
   TO UPDATE EACH WEEK: edit ONLY the WEEK object in the <script> at the
   bottom of this file. Nothing else needs to change. Each gauge value takes
   a color: "green" (constructive), "amber" (caution), or "red" (negative).
   ========================================================================= */
:root{
  --bg:#0b0a1a; --panel:rgba(255,255,255,.035); --panel-line:rgba(255,255,255,.09);
  --ink:#eceafb; --mute:#a7a2c6; --faint:#6f6a90;
  --green:#34d399; --red:#f87171; --amber:#fbbf24;
  --indigo:#818cf8; --violet:#a78bfa;
  --grad:linear-gradient(135deg,#6366f1,#8b5cf6);
  --font-head:"Sora",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
body{
  position:relative;overflow-x:hidden;padding:34px clamp(16px,3.5vw,44px) 30px;
  background:
    radial-gradient(680px 380px at 82% -6%, rgba(139,92,246,.28), transparent 70%),
    radial-gradient(640px 460px at 6% 108%, rgba(99,102,241,.22), transparent 70%),
    var(--bg);
}
.panel-wrap{max-width:1240px;margin:0 auto}

/* header */
.eyebrow{font-family:var(--font-head);font-weight:700;font-size:12.5px;letter-spacing:3px;text-transform:uppercase;color:var(--indigo)}
.eyebrow .bar{display:inline-block;width:34px;height:3px;border-radius:2px;background:var(--grad);vertical-align:middle;margin-right:12px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.wk{font-family:var(--font-head);font-size:14px;color:var(--mute);white-space:nowrap}
h1{font-family:var(--font-head);font-weight:800;font-size:clamp(28px,4.4vw,46px);letter-spacing:-.02em;line-height:1.05;margin:16px 0 8px;color:#fff}
.sub{font-size:clamp(14px,1.6vw,17px);color:var(--mute);max-width:640px}

/* verdict banner */
.verdict{
  margin:24px 0 26px;border-radius:16px;padding:22px 26px;
  display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;
  border:1px solid var(--amber);background:linear-gradient(180deg,rgba(245,158,11,.10),rgba(245,158,11,.03));
}
.verdict.green{border-color:var(--green);background:linear-gradient(180deg,rgba(52,211,153,.10),rgba(52,211,153,.03))}
.verdict.red{border-color:var(--red);background:linear-gradient(180deg,rgba(248,113,113,.10),rgba(248,113,113,.03))}
.verdict .l{display:flex;align-items:center;gap:18px;min-width:0}
.verdict .icon{flex:none;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-head);font-weight:800;font-size:24px;color:#111;background:var(--amber)}
.verdict.green .icon{background:var(--green)} .verdict.red .icon{background:var(--red)}
.verdict .k{font-family:var(--font-head);font-weight:700;font-size:11.5px;letter-spacing:2px;text-transform:uppercase;color:var(--amber)}
.verdict.green .k{color:var(--green)} .verdict.red .k{color:var(--red)}
.verdict .big{font-family:var(--font-head);font-weight:800;font-size:clamp(19px,2.4vw,26px);color:#fff;letter-spacing:-.01em;margin-top:3px;line-height:1.15}
.verdict .r{text-align:right}
.verdict .r .k{color:var(--faint)}
.verdict .posture{font-family:var(--font-head);font-weight:700;font-size:clamp(15px,1.9vw,20px);color:var(--amber);margin-top:3px}
.verdict.green .posture{color:var(--green)} .verdict.red .posture{color:var(--red)}

/* gauges grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.gauge{border:1px solid var(--panel-line);background:var(--panel);border-radius:16px;padding:22px 24px}
.gauge-head{display:flex;align-items:flex-start;gap:14px}
.badge{flex:none;width:34px;height:34px;border-radius:9px;background:var(--grad);color:#fff;
  font-family:var(--font-head);font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(99,102,241,.4)}
.gauge-head .tt{flex:1;min-width:0}
.gauge-head h3{font-family:var(--font-head);font-weight:700;font-size:19px;color:#fff}
.gauge-head .q{font-size:13.5px;color:var(--mute);margin-top:2px}
.pill{flex:none;align-self:flex-start;font-family:var(--font-head);font-weight:700;font-size:11px;letter-spacing:1px;text-transform:uppercase;
  padding:5px 12px;border-radius:999px;border:1px solid}
.pill.green{color:var(--green);border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.12)}
.pill.amber{color:var(--amber);border-color:rgba(245,158,11,.5);background:rgba(245,158,11,.12)}
.pill.red{color:var(--red);border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.12)}
.rows{margin-top:16px;display:grid;gap:0}
.row{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-top:1px solid rgba(255,255,255,.06);font-size:14px}
.row:first-child{border-top:0}
.row .lab{color:var(--mute)}
.row .val{font-family:var(--font-head);font-weight:700;text-align:right;color:var(--ink)}
.row .val.green{color:var(--green)} .row .val.amber{color:var(--amber)} .row .val.red{color:var(--red)}
.note{margin-top:14px;font-size:13.5px;font-style:italic;color:var(--faint);line-height:1.55}

/* newbie box */
.newbie{margin-top:24px;border:1px solid var(--panel-line);background:linear-gradient(180deg,rgba(99,102,241,.08),rgba(255,255,255,.02));
  border-radius:16px;padding:24px 28px}
.newbie .k{font-family:var(--font-head);font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--indigo);margin-bottom:14px}
.newbie ol{list-style:none;display:grid;gap:12px;counter-reset:n}
.newbie li{counter-increment:n;display:flex;gap:12px;font-size:15px;color:var(--ink);line-height:1.6}
.newbie li::before{content:counter(n) ".";font-family:var(--font-head);font-weight:800;color:var(--indigo);flex:none}

/* footer */
.foot{margin-top:24px;padding-top:18px;border-top:1px solid rgba(255,255,255,.08);
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.foot .bd{font-family:var(--font-head);font-weight:800;font-size:17px;color:#fff}
.foot .bd b{color:var(--violet)}
.foot .dis{font-size:12.5px;color:var(--faint)}

@media (max-width:760px){
  .grid{grid-template-columns:1fr}
  .verdict{flex-direction:column;align-items:flex-start}
  .verdict .r{text-align:left}
}
</style>
</head>
<body>
<div class="panel-wrap">
  <div class="top">
    <div class="eyebrow"><span class="bar"></span>Mr. Market &middot; The Instrument Panel</div>
    <div class="wk" id="wk"></div>
  </div>
  <h1 id="title"></h1>
  <p class="sub">Four gauges. No single one flies the plane &mdash; you read them together.</p>

  <div class="verdict" id="verdict">
    <div class="l">
      <div class="icon" id="verdict-icon">!</div>
      <div>
        <div class="k">The verdict</div>
        <div class="big" id="verdict-label"></div>
      </div>
    </div>
    <div class="r">
      <div class="k">Posture</div>
      <div class="posture" id="verdict-posture"></div>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="newbie">
    <div class="k">If you are new to this &mdash; what it means</div>
    <ol id="newbie"></ol>
  </div>

  <div class="foot">
    <div class="bd">Trade<b>2</b>Swing</div>
    <div class="dis">Educational only &middot; not a buy or sell recommendation</div>
  </div>
</div>

<script>
/* ============================ EDIT ME EACH WEEK ============================ */
const WEEK = {
  "week": "Week of Sep 1–5, 2026",
  "title": "How to read the market this week",
  "articleUrl": "https://trade2swing.substack.com/p/09-05-2026-the-panel-splits",
  "verdict": {
    "level": "amber",
    "label": "UNDER PRESSURE — the panel has split",
    "posture": "Caution, not cash."
  },
  "gauges": [
    {
      "key": "A",
      "name": "Market breadth",
      "q": "Are most stocks joining in, or just a few?",
      "status": {
        "t": "WEAKENING",
        "c": "amber"
      },
      "rows": [
        {
          "l": "T2108 (stocks above their 40-day line)",
          "v": "41.1, down from 41.9 (touched 36.4 Tue)",
          "c": "red"
        },
        {
          "l": "Stocks up 25%+ in a month",
          "v": "256 → 114 this week",
          "c": "amber"
        },
        {
          "l": "Stocks up 50%+ in a month (froth)",
          "v": "56 → 25 this week",
          "c": "amber"
        }
      ],
      "note": "In plain English: breadth cooled sharply this week — momentum thinned across the board even though the three-month base is still intact."
    },
    {
      "key": "B",
      "name": "Distribution days",
      "q": "Are big institutions quietly selling?",
      "status": {
        "t": "MIXED",
        "c": "amber"
      },
      "rows": [
        {
          "l": "NASDAQ / S&P distribution days",
          "v": "4 and 3 — under the 5–6 line",
          "c": "amber"
        },
        {
          "l": "Institutional buying grade (IBD)",
          "v": "S&P B−, NASDAQ B",
          "c": "amber"
        },
        {
          "l": "IBD market exposure guidance",
          "v": "60–80% allowed",
          "c": "green"
        }
      ],
      "note": "In plain English: selling is building but still under the danger line — the NASDAQ is a session or two from getting concerning though."
    },
    {
      "key": "C",
      "name": "New highs vs. new lows",
      "q": "Are more stocks hitting 1-year highs or lows?",
      "status": {
        "t": "MIXED",
        "c": "amber"
      },
      "rows": [
        {
          "l": "NASDAQ new 52-week highs (Friday)",
          "v": "52 — down from 62 two weeks ago",
          "c": "amber"
        },
        {
          "l": "Friday NYSE up vs. down stocks",
          "v": "1,074 up vs 1,123 down",
          "c": "red"
        },
        {
          "l": "Stocks above their 50-day (NYSE)",
          "v": "exactly half",
          "c": "amber"
        }
      ],
      "note": "In plain English: rallies are being carried by a shrinking group of stocks, not broad participation."
    },
    {
      "key": "D",
      "name": "Leadership",
      "q": "Which stocks are actually being bought?",
      "status": {
        "t": "MIXED",
        "c": "amber"
      },
      "rows": [
        {
          "l": "IBD A- vs D-graded stocks",
          "v": "A −40 to 673; D +31 to 711",
          "c": "red"
        },
        {
          "l": "Best leaders' volume",
          "v": "TARS +9.1%, MU +6.1% — both lighter than normal",
          "c": "amber"
        },
        {
          "l": "MU volume vs normal",
          "v": "13% lighter than normal on a 6.1% gain",
          "c": "amber"
        }
      ],
      "note": "In plain English: real buying exists, but it isn't showing the volume conviction of serious institutional backing."
    }
  ],
  "newbie": [
    "Two indexes, two stories: when the S&P and NASDAQ disagree, the market has lost its clean all-clear signal and moved into a caution zone — pick selectively rather than buy broadly.",
    "Volume tells the real story: rising prices on lighter-than-normal volume means buyers exist but aren't fully committed — a classic sign of a tiring market, not an accelerating one.",
    "Watch T2108 at 41.1: a close below 40 that sticks flips the posture from caution to defense."
  ]
};
/* ========================== END EDIT ME EACH WEEK ========================== */

(function render(w){
  var esc = function(s){ var d=document.createElement("div"); d.textContent=s==null?"":String(s); return d.innerHTML; };
  document.getElementById("wk").textContent = w.week;
  document.getElementById("title").textContent = w.title;
  document.title = "Mr. Market Panel — " + w.week;

  var v = w.verdict || {};
  var vb = document.getElementById("verdict");
  vb.className = "verdict " + (v.level||"amber");
  document.getElementById("verdict-icon").textContent = v.level==="green" ? "✓" : (v.level==="red" ? "✕" : "!");
  document.getElementById("verdict-label").textContent = v.label||"";
  document.getElementById("verdict-posture").textContent = v.posture||"";

  var grid = document.getElementById("grid");
  grid.innerHTML = (w.gauges||[]).map(function(g){
    var rows = (g.rows||[]).map(function(r){
      return '<div class="row"><span class="lab">'+esc(r.l)+'</span><span class="val '+(r.c||"")+'">'+esc(r.v)+'</span></div>';
    }).join("");
    return ''
      + '<div class="gauge">'
      +   '<div class="gauge-head">'
      +     '<span class="badge">'+esc(g.key)+'</span>'
      +     '<div class="tt"><h3>'+esc(g.name)+'</h3><div class="q">'+esc(g.q)+'</div></div>'
      +     '<span class="pill '+((g.status&&g.status.c)||"amber")+'">'+esc(g.status&&g.status.t)+'</span>'
      +   '</div>'
      +   '<div class="rows">'+rows+'</div>'
      +   '<div class="note">'+esc(g.note)+'</div>'
      + '</div>';
  }).join("");

  document.getElementById("newbie").innerHTML = (w.newbie||[]).map(function(t){
    return '<li>'+esc(t)+'</li>';
  }).join("");

  // tell a same-origin parent how tall our CONTENT is, so the iframe can size to it.
  // Uses content height (not the viewport), and ignores sub-pixel jitter, so it
  // cannot feed back into a growth loop with the parent's height-setter.
  var _lastH = 0;
  function postHeight(){
    var h = Math.ceil(document.documentElement.getBoundingClientRect().height);
    if (Math.abs(h - _lastH) < 2) return;
    _lastH = h;
    if (window.parent && window.parent !== window) {
      try { window.parent.postMessage({ t2sPanelHeight: h }, "*"); } catch(e){}
    }
  }
  window.addEventListener("load", postHeight);
  window.addEventListener("resize", postHeight);
  setTimeout(postHeight, 300);
  setTimeout(postHeight, 900);
})(WEEK);
</script>
</body>
</html>
